server:
  port: 8082
spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5434/products
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    open-in-view: false